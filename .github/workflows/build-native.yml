name: Build Native Cross-Platform Packages (Android & Desktop)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. ANDROID NATIVE BUILD (Debug APK, Release APK, Production AAB)
  # =========================================================================
  build-android:
    name: Build Android Packages (APK / AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Next.js Static Export & Sync Capacitor
        run: |
          pnpm build
          npx cap sync android

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Build Android Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
            export KEYSTORE_PATH=release-key.jks
          fi
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Generate Checksums
        run: |
          mkdir -p ../release/android
          find android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} ../release/android/ \;
          cd ../release/android
          sha256sum * > SHA256SUMS.txt || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bio-hitech-android-packages
          path: |
            release/android/*.apk
            release/android/*.aab
            release/android/SHA256SUMS.txt

  # =========================================================================
  # 2. LINUX DESKTOP BUILD (Tauri 2 AppImage & Debian Package)
  # =========================================================================
  build-linux:
    name: Build Linux Desktop Packages (.AppImage / .deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Static Frontend
        run: pnpm build

      - name: Build Tauri Desktop (AppImage & deb)
        run: npx tauri build

      - name: Collect Linux Installers & Generate Checksums
        run: |
          mkdir -p ../release/linux
          find src-tauri/target/release/bundle/ -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} ../release/linux/ \;
          cd ../release/linux
          sha256sum * > SHA256SUMS.txt || true

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bio-hitech-linux-desktop-packages
          path: |
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/SHA256SUMS.txt

  # =========================================================================
  # 3. WINDOWS DESKTOP BUILD (Tauri 2 NSIS .exe & WiX .msi)
  # =========================================================================
  build-windows:
    name: Build Windows Desktop Packages (.exe / .msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Static Frontend
        run: pnpm build

      - name: Build Tauri Desktop (.exe / .msi)
        run: npx tauri build

      - name: Collect Windows Installers & Generate Checksums
        shell: bash
        run: |
          mkdir -p ../release/windows
          find src-tauri/target/release/bundle/ -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} ../release/windows/ \;
          cd ../release/windows
          sha256sum * > SHA256SUMS.txt || true

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bio-hitech-windows-desktop-packages
          path: |
            release/windows/*.exe
            release/windows/*.msi
            release/windows/SHA256SUMS.txt
