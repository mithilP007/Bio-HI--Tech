name: Build Native Cross-Platform Packages (Android & Desktop)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      require_signing:
        description: 'Enforce release signing (fail if secrets are missing)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. ANDROID NATIVE BUILD (Debug APK, QA Release APK, Production AAB)
  # =========================================================================
  build-android:
    name: Build Android Packages (APK / AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 platforms;android-34 build-tools;34.0.0'

      - name: Build Next.js Static Export & Sync Capacitor
        run: |
          pnpm build
          pnpm exec cap sync android

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Build Android Packages (Release APK & AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ENFORCE_SIGNING: ${{ (github.event.inputs.require_signing == 'true' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-qa'))) && 'true' || 'false' }}
        run: |
          cd android
          mkdir -p "${{ github.workspace }}/release/android"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release keystore secrets found. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks
            export KEYSTORE_PATH=release-key.jks
            export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export KEY_ALIAS="$KEY_ALIAS"
            export KEY_PASSWORD="$KEY_PASSWORD"
            export REQUIRE_SIGNING=true
            echo "Building production-signed Release APK and AAB..."
            ./gradlew assembleRelease
            ./gradlew bundleRelease
            echo "STATUS=SIGNED" > "${{ github.workspace }}/release/android/SIGNING_STATUS.txt"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "${{ github.workspace }}/release/android/SIGNING_STATUS.txt"
          else
            if [ "$ENFORCE_SIGNING" = "true" ]; then
              echo "::error::CRITICAL: Android release signing secrets missing! All 4 secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are strictly required for production release. Unsigned release generation is rejected."
              exit 1
            else
              echo "::warning::Android release signing secrets missing. Building QA debug-signed Release APK and AAB for installation testing."
              ./gradlew assembleRelease
              ./gradlew bundleRelease
              echo "STATUS=QA_DEBUG_SIGNED" > "${{ github.workspace }}/release/android/SIGNING_STATUS.txt"
              echo "NOTE=Signed with Android debug key for testing/handover. Permanent production signing requires setting GitHub Actions secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD." >> "${{ github.workspace }}/release/android/SIGNING_STATUS.txt"
            fi
          fi

      - name: Verify Android Signatures
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          for apk in android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              echo "=== Verifying APK Signature: $apk ==="
              $APKSIGNER verify --verbose --print-certs "$apk" || true
            fi
          done

      - name: Secure Cleanup of Android Keystore
        if: always()
        run: |
          rm -f 'saran project/android/app/release-key.jks'
          rm -f android/app/release-key.jks
          rm -f android/app/*.jks
          rm -f android/app/*.keystore

      - name: Collect Android Packages & Generate Checksums
        run: |
          mkdir -p "${{ github.workspace }}/release/android"
          find android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} "${{ github.workspace }}/release/android/" \;
          cd "${{ github.workspace }}/release/android"
          for f in *release*.apk; do [ -f "$f" ] && cp "$f" BIO-HI-TECH-LIMS-Android.apk || true; done
          for f in *debug*.apk; do [ -f "$f" ] && [ ! -f "BIO-HI-TECH-LIMS-Android.apk" ] && cp "$f" BIO-HI-TECH-LIMS-Android.apk || true; done
          for f in *release*.aab; do [ -f "$f" ] && cp "$f" BIO-HI-TECH-LIMS-Android.aab || true; done
          for f in *debug*.aab; do [ -f "$f" ] && [ ! -f "BIO-HI-TECH-LIMS-Android.aab" ] && cp "$f" BIO-HI-TECH-LIMS-Android.aab || true; done
          sha256sum * > SHA256SUMS.txt || true
          ls -la "${{ github.workspace }}/release/android"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-ANDROID
          path: |
            release/android/*.apk
            release/android/*.aab
            release/android/SHA256SUMS.txt
            release/android/SIGNING_STATUS*.txt
          if-no-files-found: error

  # =========================================================================
  # 2. LINUX DESKTOP BUILD (Tauri 2 AppImage & Debian Package)
  # =========================================================================
  build-linux:
    name: Build Linux Desktop Packages (.AppImage / .deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Static Frontend
        run: pnpm build

      - name: Build Tauri Desktop (AppImage & deb)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm exec tauri build --no-before-build-command

      - name: Collect Linux Installers & Generate Checksums
        run: |
          mkdir -p "${{ github.workspace }}/release/linux"
          find src-tauri/target/release/bundle/ -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} "${{ github.workspace }}/release/linux/" \;
          cd "${{ github.workspace }}/release/linux"
          for f in *.AppImage; do [ -f "$f" ] && cp "$f" BIO-HI-TECH-LIMS.AppImage || true; done
          for f in *.deb; do [ -f "$f" ] && cp "$f" BIO-HI-TECH-LIMS.deb || true; done
          sha256sum * > SHA256SUMS.txt || true
          ls -la "${{ github.workspace }}/release/linux"

      - name: Upload Linux Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-LINUX
          path: |
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/SHA256SUMS.txt
          if-no-files-found: error

  # =========================================================================
  # 3. WINDOWS DESKTOP BUILD (Tauri 2 NSIS .exe & WiX .msi)
  # =========================================================================
  build-windows:
    name: Build Windows Desktop Packages (.exe / .msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 'saran project'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Static Frontend
        run: pnpm build

      - name: Build Tauri Desktop (.exe / .msi)
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.11\bin"
          pnpm exec tauri build --no-before-build-command

      - name: Sign Windows Installers (Authenticode)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ENFORCE_SIGNING: ${{ (github.event.inputs.require_signing == 'true' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-qa'))) && 'true' || 'false' }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release/windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            if ($env:ENFORCE_SIGNING -eq "true") {
              Write-Error "CRITICAL: Windows Authenticode signing credentials missing (WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD)! Signing is strictly enforced for production release tags or require_signing workflow dispatch."
              exit 1
            }
            Write-Host "::warning::WINDOWS_CERTIFICATE_BASE64 or WINDOWS_CERTIFICATE_PASSWORD secret is not configured in GitHub Secrets."
            Write-Host "::warning::Windows installers generated as UNSIGNED. Production signed handover is BLOCKED (Unsigned) pending EV/OV certificate provisioning."
            "STATUS=UNSIGNED" | Out-File -FilePath (Join-Path $releaseDir "SIGNING_STATUS.txt") -Encoding utf8
            "NOTE=Installers generated unsigned for testing/handover. EV/OV certificate required for SmartScreen suppression." | Out-File -FilePath (Join-Path $releaseDir "SIGNING_STATUS.txt") -Append -Encoding utf8
            exit 0
          }

          Write-Host "Locating signtool.exe in Windows Kits..."
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows Kits."
            exit 1
          }
          Write-Host "Using signtool at: $signtool"

          $certPath = Join-Path $PWD "cert.pfx"
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $installers = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.exe","*.msi" -Recurse
            foreach ($file in $installers) {
              Write-Host "Signing $($file.FullName) with Authenticode SHA256 and RFC3161 timestamp..."
              & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signing failed for $($file.FullName)"
                exit 1
              }
              Write-Host "Verifying Authenticode signature for $($file.FullName)..."
              & $signtool verify /pa /v $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signature verification failed for $($file.FullName)"
                exit 1
              }
            }
            "STATUS=SIGNED" | Out-File -FilePath (Join-Path $releaseDir "SIGNING_STATUS.txt") -Encoding utf8
            "TIMESTAMP_SERVER=http://timestamp.digicert.com" | Out-File -FilePath (Join-Path $releaseDir "SIGNING_STATUS.txt") -Append -Encoding utf8
          }
          finally {
            if (Test-Path $certPath) {
              Remove-Item -Force $certPath
            }
          }

      - name: Secure Cleanup of Windows Certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "cert.pfx") {
            Remove-Item -Force "cert.pfx"
          }

      - name: Collect Windows Installers & Generate Checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release/windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $installers = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include "*.exe","*.msi" -Recurse
          foreach ($file in $installers) {
            Copy-Item -Path $file.FullName -Destination $releaseDir -Force
            if ($file.Name -like "*setup*.exe") {
              Copy-Item -Path $file.FullName -Destination (Join-Path $releaseDir "BIO-HI-TECH-LIMS-Windows-Setup.exe") -Force
            } elseif ($file.Extension -eq ".exe" -and -not (Test-Path (Join-Path $releaseDir "BIO-HI-TECH-LIMS-Windows-Setup.exe"))) {
              Copy-Item -Path $file.FullName -Destination (Join-Path $releaseDir "BIO-HI-TECH-LIMS-Windows-Setup.exe") -Force
            } elseif ($file.Extension -eq ".msi") {
              Copy-Item -Path $file.FullName -Destination (Join-Path $releaseDir "BIO-HI-TECH-LIMS-Windows.msi") -Force
            }
          }

          Set-Location $releaseDir
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem -Path $releaseDir

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-WINDOWS
          path: |
            release/windows/*.exe
            release/windows/*.msi
            release/windows/SHA256SUMS.txt
            release/windows/SIGNING_STATUS*.txt
          if-no-files-found: error

  # =========================================================================
  # 4. GITHUB RELEASE CREATION (Triggered on tags v*)
  # =========================================================================
  publish-release:
    name: Publish GitHub Release (QA & Production)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-ANDROID
          path: release-all/android

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-LINUX
          path: release-all/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BIO-HI-TECH-LIMS-WINDOWS
          path: release-all/windows

      - name: Collate, Verify Binaries & Generate Checksums
        run: |
          mkdir -p release-bundle

          # Copy and standardize Android binaries
          find release-all/android/ -type f -name "*.apk" -exec cp {} release-bundle/BIO-HI-TECH-LIMS-Android.apk \;
          find release-all/android/ -type f -name "*.aab" -exec cp {} release-bundle/BIO-HI-TECH-LIMS-Android.aab \;
          cp release-all/android/SIGNING_STATUS.txt release-bundle/SIGNING_STATUS_ANDROID.txt 2>/dev/null || true

          # Copy and standardize Windows binaries
          find release-all/windows/ -type f -name "*Setup*.exe" -exec cp {} release-bundle/BIO-HI-TECH-LIMS-Windows-Setup.exe \;
          [ ! -f release-bundle/BIO-HI-TECH-LIMS-Windows-Setup.exe ] && find release-all/windows/ -type f -name "*.exe" -exec cp {} release-bundle/BIO-HI-TECH-LIMS-Windows-Setup.exe \;
          find release-all/windows/ -type f -name "*.msi" -exec cp {} release-bundle/BIO-HI-TECH-LIMS-Windows.msi \;
          cp release-all/windows/SIGNING_STATUS.txt release-bundle/SIGNING_STATUS_WINDOWS.txt 2>/dev/null || true

          # Copy and standardize Linux binaries
          find release-all/linux/ -type f -name "*.AppImage" -exec cp {} release-bundle/BIO-HI-TECH-LIMS.AppImage \;
          find release-all/linux/ -type f -name "*.deb" -exec cp {} release-bundle/BIO-HI-TECH-LIMS.deb \;

          # Verify each binary exists and is non-empty
          echo "=== Verifying Generated Binary Packages ==="
          MISSING_BINARIES=0
          for pkg in BIO-HI-TECH-LIMS-Android.apk BIO-HI-TECH-LIMS-Android.aab BIO-HI-TECH-LIMS-Windows-Setup.exe BIO-HI-TECH-LIMS-Windows.msi BIO-HI-TECH-LIMS.AppImage BIO-HI-TECH-LIMS.deb; do
            if [ -s "release-bundle/$pkg" ]; then
              pkg_size=$(stat -c%s "release-bundle/$pkg")
              echo "✓ Found: $pkg ($pkg_size bytes)"
            else
              echo "::error::Missing or empty release package: $pkg"
              MISSING_BINARIES=1
            fi
          done

          if [ "$MISSING_BINARIES" -ne 0 ]; then
            echo "::error::One or more required platform binary packages are missing!"
            exit 1
          fi

          # Production signing verification: If production release (not QA tag), enforce signing
          if [[ "${{ github.ref_name }}" != *"-qa"* ]]; then
            echo "=== Validating Production Signing Safeguards ==="
            if ! grep -q "STATUS=SIGNED" release-bundle/SIGNING_STATUS_ANDROID.txt 2>/dev/null; then
              echo "::error::CRITICAL: Production release rejected! Android binary was not signed with permanent production key."
              exit 1
            fi
            if ! grep -q "STATUS=SIGNED" release-bundle/SIGNING_STATUS_WINDOWS.txt 2>/dev/null; then
              echo "::error::CRITICAL: Production release rejected! Windows binary was not signed with Authenticode certificate."
              exit 1
            fi
          fi

          # Generate SHA256 checksums
          cd release-bundle
          sha256sum BIO-HI-TECH-LIMS* > SHA256SUMS.txt
          echo "=== SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Generate Release Notes
        run: |
          IS_QA="false"
          if [[ "${{ github.ref_name }}" == *"-qa"* ]]; then
            IS_QA="true"
          fi

          cat << 'EOF' > release-bundle/RELEASE_NOTES.md
          ## BIO HI TECH LIMS — Native Application Installers

          EOF

          if [ "$IS_QA" = "true" ]; then
            cat << 'EOF' >> release-bundle/RELEASE_NOTES.md
          > [!IMPORTANT]
          > **QA TEST INSTALLERS — CONTROLLED TESTING ONLY**
          > - **Android APK:** Debug-signed for immediate installation testing without production signing keys.
          > - **Windows Installer:** Unsigned installer for test deployment. Click **"More info" -> "Run anyway"** on Windows Defender SmartScreen.
          > - **Permanent Production Release:** Will be issued upon configuration of official commercial signing keys.

          EOF
          else
            cat << 'EOF' >> release-bundle/RELEASE_NOTES.md
          > [!NOTE]
          > **PRODUCTION RELEASE**
          > Verified production-signed installation packages.

          EOF
          fi

          cat << 'EOF' >> release-bundle/RELEASE_NOTES.md
          ### Available Packages:

          | Platform | Package File | Description |
          | :--- | :--- | :--- |
          | **Android Phone** | `BIO-HI-TECH-LIMS-Android.apk` | Native Android APK (Universal ARM64/x86_64) |
          | **Android Play Store** | `BIO-HI-TECH-LIMS-Android.aab` | Android App Bundle |
          | **Windows Setup** | `BIO-HI-TECH-LIMS-Windows-Setup.exe` | NSIS Full Setup Installer (Windows 10/11 x64) |
          | **Windows Enterprise** | `BIO-HI-TECH-LIMS-Windows.msi` | Enterprise WiX MSI Installer |
          | **Linux Standalone** | `BIO-HI-TECH-LIMS.AppImage` | Portable Linux Desktop executable |
          | **Linux Debian/Ubuntu** | `BIO-HI-TECH-LIMS.deb` | Debian Package (`dpkg -i`) |

          ### SHA-256 Checksums:
          ```text
          EOF
          cat release-bundle/SHA256SUMS.txt >> release-bundle/RELEASE_NOTES.md
          cat << 'EOF' >> release-bundle/RELEASE_NOTES.md
          ```

          ### Installation Instructions:
          - **Android:** Download `.apk` -> Open file -> Enable *"Allow from this source"* if prompted -> Install -> Launch & sign in.
          - **Windows:** Download `.exe` or `.msi` -> Launch installer -> If Windows Defender SmartScreen displays *"Unknown Publisher"*, click **More info** -> **Run anyway** -> Follow setup wizard.
          - **Linux:** `chmod +x BIO-HI-TECH-LIMS.AppImage && ./BIO-HI-TECH-LIMS.AppImage` or `sudo apt install ./BIO-HI-TECH-LIMS.deb`.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundle/BIO-HI-TECH-LIMS-Android.apk
            release-bundle/BIO-HI-TECH-LIMS-Android.aab
            release-bundle/BIO-HI-TECH-LIMS-Windows-Setup.exe
            release-bundle/BIO-HI-TECH-LIMS-Windows.msi
            release-bundle/BIO-HI-TECH-LIMS.AppImage
            release-bundle/BIO-HI-TECH-LIMS.deb
            release-bundle/SHA256SUMS.txt
            release-bundle/SIGNING_STATUS_ANDROID.txt
            release-bundle/SIGNING_STATUS_WINDOWS.txt
          name: ${{ contains(github.ref_name, '-qa') && format('BIO HI TECH LIMS {0} — QA INSTALLERS (Controlled Testing)', github.ref_name) || format('BIO HI TECH LIMS {0} — Production Release', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, '-qa') }}
          draft: false
          body_path: release-bundle/RELEASE_NOTES.md
