const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p2=n=>String(n).padStart(2,'0');

const DP=[[/culture|sensitivity/i,'MICROBIOLOGY'],[/urine|stool|semen|csf|sputum/i,'CLINICAL PATHOLOGY'],[/cbc|hemogram|hemoglobin|platelet|reticulocyte|prothrombin|aptt|bleeding|g6pd|sickling|blood group|smear|malaria|microfilaria|hb variant|\b(pt|pcv|esr|anc)\b/i,'HAEMATOLOGY'],[/widal|dengue|fever|rheumatoid|pregnancy|toxoplasma|rubella|cryptococcal|anti-|lupus|le cells|\b(hiv|hbsag|hcv|vdrl|aso|crp|ana|ccp)\b/i,'SEROLOGY'],[/thyroid|prolactin|estradiol|progesterone|amh|cortisol|dhea|insulin|ige|ca[ -]\d|\b(t3|t4|tsh|ft3|ft4|fsh|lh|psa|hgh)\b/i,'IMMUNOLOGY & ENDOCRINOLOGY']];
const dept=n=>(DP.find(([r])=>r.test(n))||[0,'BIOCHEMISTRY'])[1];

function qrs(t){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))r+=`<rect x="${x+2}" y="${y+2}" width="1" height="1"/>`;return`<svg viewBox="0 0 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" fill="#000" shape-rendering="crispEdges">${r}</svg>`}catch(e){return''}}
function inter(t,sx,id,k){const n=NT[t.n];if(!n||t.nonote)return'';let hi=0,lo=0;pars(t.n).forEach(p=>{const c=fl(p,(t.res||{})[p.n]??'',sx);if(c=='hi')hi=1;if(c=='lo'||(c=='no'&&p.t=='q'))lo=1});const o=[];if(hi)o.push(`<b>High / Positive result:</b> ${esc(NU[n[0]])}`);if(lo)o.push(`<b>Low / Negative result:</b> ${esc(NU[n[1]])}`);o.push(`<b>Note:</b> ${esc(NU[n[3]])}`,`<b>Sample / preparation:</b> ${esc(NU[n[2]])}`);return`<tr><td colspan="4" class="nrow"><button class="nx" onclick="dn(${id},${k})">✕ Remove note</button><b>Interpretation :</b><br>${o.join('<br>')}</td></tr>`}

const M=document.createElement('div');M.className='rp';M.style.cssText='position:absolute;left:-9999px;top:0;width:190mm;zoom:1;margin:0';M.innerHTML=`<div style="width:190mm">${pbT}${cont(2,2)}<table class="mt">${CG}${TH}${blocks.map(b=>`<tbody>${b.join('')}</tbody>`).join('')}${END}</table></div>`;document.body.appendChild(M);
const H=e=>e.getBoundingClientRect().height,bd=[...M.querySelectorAll('.mt tbody')],eh=H(bd.pop()),rh=bd.map(t=>{const rs=[...t.rows],tp=rs.map(x=>x.getBoundingClientRect().top),bt=t.getBoundingClientRect().bottom;return tp.map((v,j)=>(j+1<tp.length?tp[j+1]:bt)-v)}),th=H(M.querySelector('.mt thead')),pbh=H(M.querySelector('.pb')),ch=H(M.querySelector('.cont'));M.remove();
const A=182*96/25.4-12,capFull=A-ch-th-1,pages=[[]];let cur=0,u=pbh+th+1;const nextPage=()=>{pages.push([]);cur++;u=ch+th+1};
