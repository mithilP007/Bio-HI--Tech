[package]
name = "bio-hi-tech"
version = "1.0.0"
description = "BIO HI TECH Private Laboratory Management System"
authors = ["BIO HI TECH"]
license = "Proprietary"
edition = "2021"

[lib]
name = "bio_hi_tech_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
